[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MI77-Utils"
version = "0.2.0"
description = "Reusable Python utilities by MI77-LAB."
readme = "atelier/mi77_utils/README.md"
requires-python = ">=3.10"
authors = [
    { name = "MI77-LAB" }
]

dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0,<3.0"]
pandas = ["pandas>=2.0,<4.0"]
polars = ["polars>=1.0,<3.0"]
pyodbc = ["pyodbc>=5.0,<6.0"]
arrow = ["pyarrow>=15.0,<27.0"]
msoffcrypto = ["msoffcrypto-tool>=6.0,<7.0"]

data = ["mi77-utils[pandas,polars,arrow]"]
sql = ["mi77-utils[sqlalchemy,pyodbc]"]
all = ["mi77-utils[data,sql,msoffcrypto]"]

[tool.setuptools]
package-dir = {"" = "atelier"}

[tool.setuptools.packages.find]
where = ["atelier"]
include = ["mi77_utils*"]
